[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cartpole-idk"
version = "0.1.0"
description = "CartPole research harness for Isolation Distributional Kernel experiments."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "numpy>=2.4",
  "scipy>=1.17",
  "gymnasium[classic-control]>=1.3",
  "torch>=2.14",
  "pandas>=2.3",
  "pyarrow>=25",
  "pyidk @ git+https://github.com/dpmcgonigle-research/pyidk.git@48d9585bfd5190b6409bdc98d6383221c3e787c7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.19",
  "pandas-stubs>=2.3.2.250926",
  "matplotlib>=3.10",
  "pytest>=8.4",
  "pytest-cov>=6.0",
  "pytest-html>=4.1",
  "ruff>=0.12",
]
nb = [
  "matplotlib>=3.10",
  "jupyterlab>=4.4",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "ipykernel>=6.30",
]

[project.scripts]
cartpole-train = "cartpole_idk.cli.train:main"
cartpole-generate = "cartpole_idk.cli.generate:main"
cartpole-replay = "cartpole_idk.cli.replay:main"
cartpole-query = "cartpole_idk.cli.query:main"
cartpole-idk-evaluate = "cartpole_idk.cli.evaluate_idk:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cartpole_idk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.mypy.overrides]]
# The pinned pyidk has inline annotations but does not ship a py.typed marker.
module = ["pyidk", "pyidk.*"]
follow_untyped_imports = true
